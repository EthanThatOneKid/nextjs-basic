name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # QB64-PE ships a bundled compiler on Windows, so the e2e tests can run there.
      # Other platforms skip the e2e tests (qb64 not installed).
      - name: Install QB64-PE (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.7.0-GLFW --repo QB64-Phoenix-Edition/QB64pe -p 'qb64pe_win-x64-*.7z' -D "$RUNNER_TEMP"
          7z x "$RUNNER_TEMP"/qb64pe_win-x64-*.7z -o"$RUNNER_TEMP/qb64pe" -y > /dev/null
          echo "QB64_PATH=$(cygpath -w "$RUNNER_TEMP/qb64pe/qb64pe/qb64pe.exe")" >> "$GITHUB_ENV"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Check dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          echo "dist looks good"
