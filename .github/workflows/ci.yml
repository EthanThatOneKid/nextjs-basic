name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QB64PE_VERSION: v4.7.0-GLFW

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # The e2e tests compile real routes, so every platform needs QB64-PE.
      # Windows ships a bundled compiler; Linux and macOS build it from source once
      # and cache the result.
      - name: Install QB64-PE (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$QB64PE_VERSION" --repo QB64-Phoenix-Edition/QB64pe -p 'qb64pe_win-x64-*.7z' -D "$RUNNER_TEMP"
          7z x "$RUNNER_TEMP"/qb64pe_win-x64-*.7z -o"$RUNNER_TEMP/qb64pe" -y > /dev/null
          echo "QB64_PATH=$(cygpath -w "$RUNNER_TEMP/qb64pe/qb64pe/qb64pe.exe")" >> "$GITHUB_ENV"

      # The compiler links against these, so they are needed on every run. A cache hit
      # restores the compiler but not the system packages it was built against.
      - name: Install QB64-PE system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential x11-utils mesa-common-dev libglu1-mesa-dev libasound2-dev libpng-dev libcurl4-openssl-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Cache QB64-PE (Linux, macOS)
        if: runner.os != 'Windows'
        id: qb64-cache
        uses: actions/cache@v4
        with:
          path: ~/qb64pe
          key: qb64pe-${{ runner.os }}-${{ runner.arch }}-${{ env.QB64PE_VERSION }}-1

      - name: Build QB64-PE (Linux, macOS)
        if: runner.os != 'Windows' && steps.qb64-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) asset='qb64pe_lnx-x64-*.tar.gz'; setup='./setup_lnx.sh' ;;
            macOS) asset='qb64pe_osx-*.tar.gz'; setup='./setup_osx.command' ;;
          esac
          gh release download "$QB64PE_VERSION" --repo QB64-Phoenix-Edition/QB64pe -p "$asset" -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/qb64pe_*.tar.gz -C "$HOME"
          cd "$HOME/qb64pe"
          # any argument stops the script from launching the IDE afterwards
          "$setup" no-launch
          # The first compile builds QB64's own support libraries. Do it now so the
          # cache holds them and the tests do not pay for it.
          printf '$CONSOLE:ONLY\nPRINT "ok"\nSYSTEM\n' > warm.bas
          ./qb64pe -x warm.bas -o "$PWD/warm"
          ./warm

      - name: Point the tests at QB64-PE (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "QB64_PATH=$HOME/qb64pe/qb64pe" >> "$GITHUB_ENV"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --runInBand --verbose --forceExit
        env:
          E2E_TRACE: '1'
          # fail instead of silently skipping the e2e tests when no compiler is found
          REQUIRE_QB64: '1'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Check dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          echo "dist looks good"

      # What a user gets from `npm install`: pack (which runs prepare), install the
      # tarball into an empty project, and load both entry points.
      - name: Packed package installs and loads
        shell: bash
        run: |
          npm pack --silent
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true}' > package.json
          npm install --no-audit --no-fund --legacy-peer-deps "$GITHUB_WORKSPACE"/nextjs-basic-*.tgz
          node -e "const m = require('nextjs-basic'); if (typeof m.withBasic !== 'function') process.exit(1); require('nextjs-basic/runtime'); console.log('package loads')"
          test -f node_modules/nextjs-basic/src/runtime/runtime.bas

  # The deployment story depends on this image, so build it, start it and call the routes.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f example/Dockerfile -t nextjs-basic-example .

      - name: Start the container
        run: docker run -d --name app -p 3000:3000 nextjs-basic-example

      - name: Call every example route
        shell: bash
        run: |
          set -eu
          base=http://127.0.0.1:3000

          echo "waiting for the server"
          for i in $(seq 1 45); do
            if curl -fsS "$base/api/status" > /dev/null 2>&1; then break; fi
            sleep 2
          done

          check() { # name, expected substring, actual
            if printf '%s' "$3" | grep -qF -- "$2"; then echo "ok   $1"; else echo "FAIL $1: expected '$2' in: $3"; exit 1; fi
          }

          check "GET with a query string" 'Hello, Docker!' "$(curl -fsS "$base/api/hello?name=Docker")"
          check "POST with a body" 'hi hi' "$(curl -fsS -X POST -H 'content-type: application/json' -d '{"message":"hi","count":2}' "$base/api/echo")"
          check "Fail returns 400" '400' "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$base/api/echo")"
          check "dynamic segment and query" '"id":"42"' "$(curl -fsS "$base/api/users/42?verbose=1")"
          check "Fail returns 404" '404' "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/users/0")"
          check "CORS header" 'access-control-allow-origin: *' "$(curl -fsS -D - -o /dev/null "$base/api/status" | tr 'A-Z' 'a-z')"
          check "HEAD has no body" '200' "$(curl -s -o /dev/null -w '%{http_code}' -I "$base/api/status")"
          check "OPTIONS preflight" '204' "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$base/api/status")"

      - name: Container log
        if: always()
        run: docker logs app
